# =============================================================
# Energy School — Configuración de Eclipse Mosquitto v2
# =============================================================
# Este archivo configura el broker MQTT central de la escuela.
#
# SEGURIDAD: Esta configuración permite conexiones anónimas,
# lo cual es aceptable SOLO en redes locales aisladas (LAN
# de la escuela). Para acceso externo o producción con
# internet, configurar autenticación con password_file o
# certificados TLS.
# =============================================================

# ─────────────────────────────────────────────────────────
# LISTENER 1: Protocolo MQTT (TCP) — Puerto 1883
# ─────────────────────────────────────────────────────────
# Los ESP32 y el servicio mqtt-bridge se conectan por aquí.
listener 1883
protocol mqtt

# ─────────────────────────────────────────────────────────
# LISTENER 2: Protocolo WebSocket — Puerto 9001
# ─────────────────────────────────────────────────────────
# Permite conexiones MQTT sobre WebSocket desde navegadores.
# Útil para debugging y herramientas como MQTT Explorer.
listener 9001
protocol websockets

# ─────────────────────────────────────────────────────────
# AUTENTICACIÓN
# ─────────────────────────────────────────────────────────
# Permitir conexiones sin usuario/contraseña (red local).
# Para producción con acceso externo, cambiar a false y
# configurar: password_file /mosquitto/config/passwd
allow_anonymous true

# ─────────────────────────────────────────────────────────
# PERSISTENCIA
# ─────────────────────────────────────────────────────────
# Guardar mensajes retenidos y sesiones en disco.
# Los datos se almacenan en el volumen Docker mosquitto_data.
persistence true
persistence_location /mosquitto/data/

# ─────────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────────
# Enviar logs a stdout para visibilidad en Docker (docker logs).
log_dest stdout
# Nivel de log: debug, error, warning, notice, information, all
log_type warning
log_type error
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ─────────────────────────────────────────────────────────
# LÍMITES DE CONEXIÓN
# ─────────────────────────────────────────────────────────
# Máximo de conexiones simultáneas (-1 = sin límite).
# Para una escuela típica (~50 salones), 100 es suficiente.
max_connections 100

# Tamaño máximo de mensaje MQTT (bytes). 1KB es más que
# suficiente para los payloads JSON de los sensores.
message_size_limit 1024
